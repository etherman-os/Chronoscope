# Production Docker Compose
# WARNING: Use this file for production deployments only.
# Internal services do NOT bind to host ports.

version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: chronoscope-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-chronoscope}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-chronoscope}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-chronoscope} -d ${DB_NAME:-chronoscope}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: chronoscope-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: chronoscope-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  ingestion:
    build:
      context: ../services/ingestion
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SERVER_ADDR: :8080
      DATABASE_URL: postgres://${DB_USER:-chronoscope}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-chronoscope}?sslmode=require
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_USER}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD}
      MINIO_SECURE: "false"
      S3_BUCKET: ${S3_BUCKET:-chronoscope-sessions}
      S3_PROCESSED_BUCKET: ${S3_PROCESSED_BUCKET:-chronoscope-processed}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN}
      DB_MAX_OPEN_CONNS: "25"
      DB_MAX_IDLE_CONNS: "5"
      DB_CONN_MAX_LIFETIME_MINUTES: "30"
      RATE_LIMIT_REQUESTS: "100"
      RATE_LIMIT_INTERVAL: "1m"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  analytics:
    build:
      context: ../services/analytics
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SERVER_ADDR: :8081
      DATABASE_URL: postgres://${DB_USER:-chronoscope}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-chronoscope}?sslmode=require
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      DB_MAX_OPEN_CONNS: "25"
      DB_MAX_IDLE_CONNS: "5"
      DB_CONN_MAX_LIFETIME_MINUTES: "30"
      RATE_LIMIT_REQUESTS: "100"
      RATE_LIMIT_INTERVAL: "1m"
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  processor:
    build:
      context: ../services/processor
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${DB_USER:-chronoscope}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-chronoscope}?sslmode=require
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-chronoscope-sessions}
      S3_PROCESSED_BUCKET: ${S3_PROCESSED_BUCKET:-chronoscope-processed}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  web:
    build:
      context: ../services/web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-https://api.yourdomain.com/v1}
    ports:
      - "127.0.0.1:3000:80"
    networks:
      - frontend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  frontend:
  backend:
